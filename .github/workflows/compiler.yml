name: Compiler

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:

  photometrie:
    name: Photométrie
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      # Le module core ne dépend pas d'Android : il se teste sans SDK ni émulateur.
      - name: Vérifier les calculs
        run: ./gradlew :core:test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rapport-tests-photometrie
          path: core/build/reports/tests/test

  page:
    name: Page hors-ligne
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Vérifier index.html
        run: node tests/verifier.mjs

  photometrie-ios:
    name: Photométrie iOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      # Le module CelluleCore ne dépend pas d'iOS : il se teste sans simulateur
      # ni projet Xcode, exactement comme son jumeau Kotlin se teste sans SDK.
      - name: Vérifier les calculs
        run: swift test --package-path ios

  application-ios:
    name: Application iOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      # Destination générique et signature désactivée : la compilation se
      # vérifie sans compte de développeur ni runtime de simulateur installé.
      - name: Compiler l'application
        run: |
          xcodebuild build \
            -project ios/Cellule.xcodeproj \
            -scheme Cellule \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO

  ipa:
    name: IPA
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      # Un binaire pour vrai appareil, sans signature : la clé de signature
      # n'appartient qu'au porteur du téléphone, et n'a rien à faire ici.
      - name: Construire l'application pour appareil
        run: |
          xcodebuild build \
            -project ios/Cellule.xcodeproj \
            -scheme Cellule \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build/dd \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO
      # Un .ipa n'est qu'un zip contenant Payload/<nom>.app : c'est ce format
      # qu'attendent les outils de signature côté utilisateur.
      - name: Empaqueter en IPA
        run: |
          APP="build/dd/Build/Products/Release-iphoneos/Cellule.app"
          test -d "$APP" || { echo "application introuvable"; ls -R build/dd/Build/Products || true; exit 1; }
          mkdir -p paquet/Payload
          cp -R "$APP" paquet/Payload/
          (cd paquet && zip -qry ../cellule-non-signe.ipa Payload)
          unzip -l cellule-non-signe.ipa | head -20
      - uses: actions/upload-artifact@v4
        with:
          name: cellule-ipa
          path: cellule-non-signe.ipa
          if-no-files-found: error

  apk:
    name: APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Construire l'APK de débogage
        run: ./gradlew :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: cellule-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  # Les artefacts d'Actions arrivent en zip et exigent d'être connecté : peu
  # commode depuis un téléphone. Une Release à tag fixe donne un lien direct
  # vers le .apk, toujours à jour, qu'on ouvre d'une touche sur l'appareil.
  publier-ipa:
    name: Publier l'IPA
    needs: ipa
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: cellule-ipa
          path: ipa
      - name: Publier la Release « ipa »
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes=$(cat <<TEXTE
          Compilation de \`${GITHUB_SHA:0:7}\` sur \`${GITHUB_REF_NAME}\`.

          **[Télécharger cellule-non-signe.ipa](https://github.com/${GITHUB_REPOSITORY}/releases/download/ipa/cellule-non-signe.ipa)**

          Cet IPA n'est **pas signé** : un iPhone le refusera tel quel. Apple
          exige qu'une application soit signée par un identifiant Apple, et
          cette clé n'appartient qu'au porteur du téléphone.

          La marche à suivre est dans le README, section « Installer sans
          passer par l'App Store ». En deux mots : AltStore ou Sideloadly le
          signent avec ton propre identifiant Apple, gratuitement, pour sept
          jours renouvelables ; un compte développeur payant porte ça à un an,
          ou ouvre TestFlight, qui s'installe d'un lien depuis le téléphone.

          Ce lien ne change jamais et pointe toujours sur la dernière compilation.
          TEXTE
          )
          gh release delete ipa --yes --cleanup-tag 2>/dev/null || true
          gh release create ipa ipa/cellule-non-signe.ipa \
            --title "Cellule — dernier IPA (non signé)" \
            --notes "$notes" \
            --prerelease

  publier:
    name: Publier l'APK
    needs: apk
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: cellule-debug
          path: apk
      - name: Nommer le fichier
        run: mv apk/*.apk cellule.apk
      - name: Publier la Release « apk »
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes=$(cat <<TEXTE
          Compilation de \`${GITHUB_SHA:0:7}\` sur \`${GITHUB_REF_NAME}\`.

          **[Télécharger cellule.apk](https://github.com/${GITHUB_REPOSITORY}/releases/download/apk/cellule.apk)**

          Ouvre ce lien depuis le téléphone : Android téléchargera le fichier,
          puis demandera d'autoriser l'installation depuis cette source. C'est
          un APK de débogage, non signé par le Play Store.

          Ce lien ne change jamais et pointe toujours sur la dernière compilation.
          TEXTE
          )
          gh release delete apk --yes --cleanup-tag 2>/dev/null || true
          gh release create apk cellule.apk \
            --title "Cellule — dernier APK" \
            --notes "$notes" \
            --prerelease
