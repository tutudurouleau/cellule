name: Compiler

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:

  photometrie:
    name: Photométrie
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      # Le module core ne dépend pas d'Android : il se teste sans SDK ni émulateur.
      - name: Vérifier les calculs
        run: ./gradlew :core:test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rapport-tests-photometrie
          path: core/build/reports/tests/test

  page:
    name: Page hors-ligne
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Vérifier index.html
        run: node tests/verifier.mjs

  apk:
    name: APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      # Par défaut l'action installe aussi l'ancien paquet « tools », qui
      # n'existe plus avec les cmdline-tools récentes des runners. Gradle
      # télécharge lui-même la plateforme et les build-tools dont il a besoin.
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
      - name: Construire l'APK de débogage
        run: ./gradlew :app:assembleDebug
      # Android n'installe une mise à jour par-dessus l'application que si
      # elle porte la même signature et un numéro de version au moins égal ;
      # sinon il faut désinstaller, et le carnet est perdu. On le vérifie
      # contre l'APK publié avant de le remplacer.
      - name: Vérifier que l'APK s'installe par-dessus le précédent
        run: |
          outils=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          nouveau=$(ls app/build/outputs/apk/debug/*.apk)
          if ! curl -sfL -o precedent.apk "https://github.com/${GITHUB_REPOSITORY}/releases/download/apk/cellule.apk"; then
            echo "Aucun APK publié à comparer."
            exit 0
          fi
          signature() { "$outils/apksigner" verify --print-certs "$1" | grep -m1 "certificate SHA-256 digest" | awk '{print $NF}'; }
          version() { "$outils/aapt2" dump badging "$1" | sed -n "s/.*versionCode='\([0-9]*\)'.*/\1/p"; }
          avant=$(signature precedent.apk); apres=$(signature "$nouveau")
          echo "Signature : $avant → $apres"
          echo "Version : $(version precedent.apk) → $(version "$nouveau")"
          if [ -z "$apres" ] || [ "$avant" != "$apres" ]; then
            echo "::error::La signature a changé : l'APK ne s'installerait pas par-dessus le précédent."
            exit 1
          fi
          if [ "$(version "$nouveau")" -lt "$(version precedent.apk)" ]; then
            echo "::error::Le numéro de version a baissé : Android refuserait la mise à jour."
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: cellule-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  # Les artefacts d'Actions arrivent en zip et exigent d'être connecté : peu
  # commode depuis un téléphone. Une Release à tag fixe donne un lien direct
  # vers le .apk, toujours à jour, qu'on ouvre d'une touche sur l'appareil.
  publier:
    name: Publier l'APK
    needs: apk
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: cellule-debug
          path: apk
      - name: Nommer le fichier
        run: mv apk/*.apk cellule.apk
      - name: Publier la Release « apk »
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes=$(cat <<TEXTE
          Compilation de \`${GITHUB_SHA:0:7}\` sur \`${GITHUB_REF_NAME}\`.

          **[Télécharger cellule.apk](https://github.com/${GITHUB_REPOSITORY}/releases/download/apk/cellule.apk)**

          Ouvre ce lien depuis le téléphone : Android téléchargera le fichier,
          puis demandera d'autoriser l'installation depuis cette source. C'est
          un APK de débogage, non signé par le Play Store.

          Ce lien ne change jamais et pointe toujours sur la dernière compilation.
          TEXTE
          )
          gh release delete apk --yes --cleanup-tag 2>/dev/null || true
          gh release create apk cellule.apk \
            --title "Cellule — dernier APK" \
            --notes "$notes" \
            --prerelease
