name: Fiches fabricants

# Les sites des fabricants ne répondent qu'aux machines de GitHub : le texte
# de chaque fiche de outils/fiches.txt est imprimé dans le journal du job, à
# relire avant de recopier un chiffre dans core. Rien n'est versé.
on:
  push:
    paths:
      - "outils/fiches.txt"
      - "outils/fiches.py"
  workflow_dispatch:

jobs:
  lire:
    name: Lire les fiches
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Installer pdftotext
        run: sudo apt-get install -y poppler-utils > /dev/null
      - name: Lire les fiches
        run: python3 outils/fiches.py
